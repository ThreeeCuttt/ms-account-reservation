spring:
  application:
    name: ms-account-reservation
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/account_reservation}
    username: ${DATABASE_USER:admin}
    password: ${DATABASE_PASSWORD:admin}
    driver-class-name: ${DATABASE_DRIVER:org.postgresql.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: ${LIQUIBASE_CHANGE_LOG:classpath:db/changelog/db-changelog-master.xml}
    contexts: ${LIQUIBASE_CONTEXTS:dev}

server:
  port: ${SERVER_PORT:8080}

