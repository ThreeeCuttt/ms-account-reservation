# Database connection
DATABASE_URL=jdbc:postgresql://localhost:5432/account_reservation
DATABASE_USER=admin
DATABASE_PASSWORD=admin
DATABASE_DRIVER=org.postgresql.Driver

# JPA / Hibernate
JPA_DDL_AUTO=validate
JPA_SHOW_SQL=true
JPA_FORMAT_SQL=true

# Liquibase
LIQUIBASE_ENABLED=true
LIQUIBASE_CHANGE_LOG=classpath:db/changelog/db-changelog-master.xml
LIQUIBASE_CONTEXTS=dev

# Server
SERVER_PORT=8080


